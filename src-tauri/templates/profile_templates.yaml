templates:
  - id: basic
    name: 基础映射方案
    description: 预设常用 AI Hook 到内部事件的映射和基础输出规则，不启用任何 Hook。
    recommended: true
    aiEventMappings:
      - id: codex-session-start
        source: codex
        event: SessionStart
        internalEvent: agent.started
      - id: codex-user-prompt
        source: codex
        event: UserPromptSubmit
        internalEvent: agent.started
      - id: codex-pre-tool-use
        source: codex
        event: PreToolUse
        internalEvent: tool.executing
      - id: codex-post-tool-use
        source: codex
        event: PostToolUse
        internalEvent: agent.working
      - id: codex-permission-request
        source: codex
        event: PermissionRequest
        internalEvent: agent.waiting_input
      - id: codex-stop
        source: codex
        event: Stop
        internalEvent: agent.completed
      - id: claude-session-start
        source: claude-code
        event: SessionStart
        internalEvent: agent.started
      - id: claude-user-prompt
        source: claude-code
        event: UserPromptSubmit
        internalEvent: agent.started
      - id: claude-pre-tool-use
        source: claude-code
        event: PreToolUse
        internalEvent: tool.executing
      - id: claude-post-tool-use
        source: claude-code
        event: PostToolUse
        internalEvent: agent.working
      - id: claude-post-tool-failure
        source: claude-code
        event: PostToolUseFailure
        internalEvent: agent.failed
      - id: claude-notification
        source: claude-code
        event: Notification
        internalEvent: notification
      - id: claude-permission-request
        source: claude-code
        event: PermissionRequest
        internalEvent: agent.waiting_input
      - id: claude-stop
        source: claude-code
        event: Stop
        internalEvent: agent.completed
      - id: claude-stop-failure
        source: claude-code
        event: StopFailure
        internalEvent: agent.failed
      - id: gemini-session-start
        source: gemini-cli
        event: SessionStart
        internalEvent: agent.started
      - id: gemini-before-agent
        source: gemini-cli
        event: BeforeAgent
        internalEvent: agent.started
      - id: gemini-before-tool
        source: gemini-cli
        event: BeforeTool
        internalEvent: tool.executing
      - id: gemini-after-tool
        source: gemini-cli
        event: AfterTool
        internalEvent: agent.working
      - id: gemini-notification
        source: gemini-cli
        event: Notification
        internalEvent: agent.waiting_input
      - id: gemini-after-agent
        source: gemini-cli
        event: AfterAgent
        internalEvent: agent.completed
      - id: cursor-session-start
        source: cursor
        event: sessionStart
        internalEvent: agent.started
      - id: cursor-before-submit-prompt
        source: cursor
        event: beforeSubmitPrompt
        internalEvent: agent.started
      - id: cursor-pre-tool-use
        source: cursor
        event: preToolUse
        internalEvent: tool.executing
      - id: cursor-post-tool-use
        source: cursor
        event: postToolUse
        internalEvent: agent.working
      - id: cursor-post-tool-use-failure
        source: cursor
        event: postToolUseFailure
        internalEvent: agent.failed
      - id: cursor-stop
        source: cursor
        event: stop
        internalEvent: agent.completed
      - id: copilot-session-start
        source: github-copilot-cli
        event: sessionStart
        internalEvent: agent.started
      - id: copilot-user-prompt
        source: github-copilot-cli
        event: userPromptSubmitted
        internalEvent: agent.started
      - id: copilot-pre-tool-use
        source: github-copilot-cli
        event: preToolUse
        internalEvent: tool.executing
      - id: copilot-post-tool-use
        source: github-copilot-cli
        event: postToolUse
        internalEvent: agent.working
      - id: copilot-post-tool-use-failure
        source: github-copilot-cli
        event: postToolUseFailure
        internalEvent: agent.failed
      - id: copilot-permission-request
        source: github-copilot-cli
        event: permissionRequest
        internalEvent: agent.waiting_input
      - id: copilot-agent-stop
        source: github-copilot-cli
        event: agentStop
        internalEvent: agent.completed
      - id: copilot-error
        source: github-copilot-cli
        event: errorOccurred
        internalEvent: agent.failed
    hardwareRules:
      - id: agent-started-system-notification-output
        internalEvent: agent.started
        output:
          type: system-notification
          notificationLevel: info
          notificationTitle: "{{source}} 开始处理任务"
          notificationBody: "模型：{{model}}，事件：{{event}}"
          notificationTitleMaxChars: 80
          notificationBodyMaxChars: 300
          notificationThrottleSeconds: 30
          notificationSound: default
        priority: 60
      - id: agent-working-system-notification-output
        internalEvent: agent.working
        output:
          type: system-notification
          notificationLevel: info
          notificationTitle: "{{source}} · {{internalEvent}}"
          notificationBody: "模型：{{model}}，事件：{{event}}"
          notificationTitleMaxChars: 80
          notificationBodyMaxChars: 300
          notificationThrottleSeconds: 30
          notificationSound: default
        priority: 60
      - id: tool-executing-system-notification-output
        internalEvent: tool.executing
        output:
          type: system-notification
          notificationLevel: info
          notificationTitle: "{{source}} 正在调用工具"
          notificationBody: "工具：{{tool_name}}，模型：{{model}}"
          notificationTitleMaxChars: 80
          notificationBodyMaxChars: 300
          notificationThrottleSeconds: 30
          notificationSound: default
        priority: 70
      - id: agent-waiting-input-system-notification-output
        internalEvent: agent.waiting_input
        output:
          type: system-notification
          notificationLevel: info
          notificationTitle: "{{source}} 等待输入"
          notificationBody: "当前事件：{{internalEvent}}"
          notificationTitleMaxChars: 80
          notificationBodyMaxChars: 300
          notificationThrottleSeconds: 30
          notificationSound: default
        priority: 80
      - id: notification-system-notification-output
        internalEvent: notification
        output:
          type: system-notification
          notificationLevel: info
          notificationTitle: "{{source}} 发出通知"
          notificationBody: "事件：{{event}}，模型：{{model}}"
          notificationTitleMaxChars: 80
          notificationBodyMaxChars: 300
          notificationThrottleSeconds: 30
          notificationSound: default
        priority: 75
      - id: agent-completed-system-notification-output
        internalEvent: agent.completed
        output:
          type: system-notification
          notificationLevel: info
          notificationTitle: "{{source}} 已完成任务"
          notificationBody: "{{last_assistant_message}}"
          notificationTitleMaxChars: 80
          notificationBodyMaxChars: 300
          notificationThrottleSeconds: 30
          notificationSound: default
        priority: 60
      - id: agent-failed-system-notification-output
        internalEvent: agent.failed
        output:
          type: system-notification
          notificationLevel: info
          notificationTitle: "{{source}} 任务异常"
          notificationBody: "事件：{{event}}，模型：{{model}}"
          notificationTitleMaxChars: 80
          notificationBodyMaxChars: 300
          notificationThrottleSeconds: 30
          notificationSound: default
        priority: 100


boards:
  - id: rp2040-pico
    displayName: Raspberry Pi Pico
    family: raspberry-pi-pico
    chip: rp2040
    mcu: rp2040
    protocolVersion: 2
    defaultTransport: serial
    defaultBaudRate: 115200
    supportedTransports: [serial]
    supportedFlashStrategies: [uf2_mount_copy]
    identity:
      stableUid: required
    pinCatalogId: rp2040-pico
    defaultChannelTemplateIds:
      - rp2040-digital-output
      - rp2040-buzzer
  - id: rp2040-pico-oled-096
    displayName: Raspberry Pi Pico + OLED 0.96" 128x64
    family: raspberry-pi-pico
    chip: rp2040
    mcu: rp2040
    protocolVersion: 2
    defaultTransport: serial
    defaultBaudRate: 115200
    supportedTransports: [serial]
    supportedFlashStrategies: [uf2_mount_copy]
    identity:
      stableUid: required
    deviceExtensions:
      display:
        status: true
        card: false
        lines: true
        runtime: true
        clear: true
        sizeClass: small
        statuses: [notice, working, success, warning, error]
        titleMaxChars: 16
        messageMaxChars: 16
        textEncoding: ascii
    pinCatalogId: rp2040-pico-oled-096
    defaultChannelTemplateIds:
      - rp2040-digital-output
      - rp2040-buzzer

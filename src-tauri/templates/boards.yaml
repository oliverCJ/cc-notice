    supportedTransports: [serial]
    supportedFlashStrategies: [arduino_cli_upload]
    identity:
      stableUid: required
    deviceExtensions:
      display:
        status: true
        card: true
        lines: true
        runtime: true
        clear: true
        sizeClass: medium
        statuses: [notice, working, success, warning, error]
        titleMaxChars: 39
        messageMaxChars: 95
        textEncoding: ascii
      buzzer:
        patterns: [notice, success, warning, error, working]
      inputs:
        buttons:
          status: supported
          controls: [button.a, button.b, button.c, fiveway.up, fiveway.down]
    pinCatalogId: seeed-wio-terminal
    defaultChannelTemplateIds:
      - seeed-wio-terminal-digital-output
      - seeed-wio-terminal-buzzer


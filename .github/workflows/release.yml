name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build app packages
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.target == 'windows') && '{"include":[{"os":"windows-latest","artifact_name":"cc-notice-windows"}]}' || (github.event_name == 'workflow_dispatch' && inputs.target == 'macos') && '{"include":[{"os":"macos-latest","artifact_name":"cc-notice-macos-intel","mac_target":"x64"},{"os":"macos-latest","artifact_name":"cc-notice-macos-apple-silicon","mac_target":"arm64"}]}' || '{"include":[{"os":"macos-latest","artifact_name":"cc-notice-macos-intel","mac_target":"x64"},{"os":"macos-latest","artifact_name":"cc-notice-macos-apple-silicon","mac_target":"arm64"},{"os":"windows-latest","artifact_name":"cc-notice-windows"}]}') }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Install macOS Rust target
        if: runner.os == 'macOS'
        run: |
          if [ "${{ matrix.mac_target }}" = "x64" ]; then
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
          else
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: npm run package:mac:${{ matrix.mac_target }}

      - name: Build Windows NSIS package
        if: runner.os == 'Windows'
        run: npx tauri build --bundles nsis

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app.tar.gz
            src-tauri/target/**/bundle/**/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app.tar.gz
            src-tauri/target/**/bundle/**/*.exe
          draft: true
